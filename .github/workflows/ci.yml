name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Linux:
    name: Linux
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: ./x check

  # The pipeline depends on the git binary, not just on Go, and the two major
  # implementations disagree about patch output in small ways.
  macOS:
    name: macOS
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: ./x check

  # Branch protection requires a check named "Required"; it aggregates the
  # matrix so the ruleset does not have to name every runner.
  Required:
    name: Required
    needs: [Linux, macOS]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Both platforms must pass
        run: |
          test "${{ needs.Linux.result }}" = success
          test "${{ needs.macOS.result }}" = success
